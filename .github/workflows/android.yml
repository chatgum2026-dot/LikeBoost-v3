
name: Build LikeBoost Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -q LikeBoost-Android-Starter.zip -d source
          find source -name gradlew -type f

      - name: Build APK
        run: |
          chmod +x $(find source -name gradlew -type f | head -1)
          cd $(dirname $(find source -name gradlew -type f | head -1))
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: LikeBoost-APK
          path: source/**/build/outputs/apk/debug/*.apk
